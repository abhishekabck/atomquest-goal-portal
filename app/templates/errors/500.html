<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Server Error | AtomQuest</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root { --primary: #1E3A5F; --accent: #F57C00; }
    body { background: #F0F4F8; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .error-card { background: #fff; border-radius: 16px; padding: 3rem; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,.10); max-width: 480px; width: 100%; }
    .error-code { font-size: 6rem; font-weight: 800; color: var(--primary); line-height: 1; }
    .error-accent { color: #dc3545; }
    .error-msg { font-size: 1.25rem; font-weight: 600; color: #333; margin: .5rem 0 .25rem; }
    .error-sub { color: #6c757d; font-size: .95rem; margin-bottom: 2rem; }
    .btn-home { background: var(--primary); color: #fff; border: none; padding: .65rem 1.75rem; border-radius: 8px; font-size: .95rem; text-decoration: none; display: inline-flex; align-items: center; gap: .5rem; transition: background .15s; }
    .btn-home:hover { background: #2a4f80; color: #fff; }
    .brand { display: flex; align-items: center; justify-content: center; gap: .75rem; margin-bottom: 2.5rem; }
    .brand-icon { width: 40px; height: 40px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 1.2rem; }
    .brand-name { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
    .brand-sub { font-size: .75rem; color: #6c757d; }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="brand">
      <div class="brand-icon">A</div>
      <div>
        <div class="brand-name">GoalTracker</div>
        <div class="brand-sub">Atomberg Portal</div>
      </div>
    </div>
    <div class="error-code">5<span class="error-accent">0</span>0</div>
    <div class="error-msg">Something Went Wrong</div>
    <div class="error-sub">An unexpected error occurred on our side. Please try again in a moment.</div>
    <a href="/" class="btn-home"><i class="bi bi-arrow-repeat"></i> Try Again</a>
  </div>
</body>
</html>
